# Release pipeline for Prime Env Harness.
#
# Pushing a version tag (vX.Y.Z, or vX.Y.Z-rc.1 for a prerelease) builds the
# prime-env-harness binary for four platforms, packages each into an
# exe-adjacent tarball (scripts/package_env_release.py), smoke-tests the
# extracted payload, and attaches the tarballs plus SHA256SUMS to a GitHub
# Release. The tag must match the workspace version in Cargo.toml.
#
# Nothing here uses repository secrets: the release is created with the
# workflow's own GITHUB_TOKEN.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-linux:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    # GLIBC 2.35 baseline: artifacts built on the ubuntu-24.04 runner image
    # require GLIBC_2.39 and do not start on Ubuntu 22.04. The host runner
    # only supplies CPU; this container pins the build glibc. The image is
    # a multi-arch index pinned by digest, so aarch64 stays a native build.
    container:
      image: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    # Container jobs run `run:` steps with dash; pin the steps to bash.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-24.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build prerequisites (Ubuntu 22.04 container)
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates python3 git binutils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The tag matches the workspace version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match the workspace version ${version}"
            exit 1
          fi
      # The pinned SHA is the toolchain pin: this action version has no
      # `toolchain` input. Change the compiler by changing the SHA.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The glibc235 marker scopes the cache to the Ubuntu 22.04 baseline.
          key: ${{ matrix.target }}-glibc235
      - name: Build (release, locked)
        run: cargo build --release --locked --target ${{ matrix.target }} -j 4 -p pa-cli --bin prime-env-harness
      - name: "GLIBC baseline gate: no symbols above GLIBC_2.35 (Ubuntu 22.04)"
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/prime-env-harness"
          syms="$(objdump -T "${bin}" | grep -o 'GLIBC_[0-9.]*' || true)"
          if [ -z "${syms}" ]; then
            echo "::error::could not inspect ${bin} with objdump"
            exit 1
          fi
          max_glibc="$(printf '%s\n' "${syms}" | sort -Vu | tail -1)"
          echo "highest GLIBC symbol required: ${max_glibc}"
          top="$(printf '%s\nGLIBC_2.35\n' "${max_glibc}" | sort -Vu | tail -1)"
          if [ "${top}" != "GLIBC_2.35" ]; then
            echo "::error::binary requires ${max_glibc}, above the GLIBC_2.35 baseline"
            exit 1
          fi
      - name: Package
        run: |
          python3 scripts/package_env_release.py \
            --binary "target/${{ matrix.target }}/release/prime-env-harness" \
            --platform "${{ matrix.platform }}" \
            --out-dir dist
      - name: Smoke-test the extracted payload
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scratch="$(mktemp -d)"
          tar -xzf "dist/prime-env-harness-${version}-${{ matrix.platform }}.tar.gz" -C "${scratch}"
          cd "${scratch}"
          "prime-env-harness-${version}-${{ matrix.platform }}/prime-env-harness" --version
      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  build-macos:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            target: aarch64-apple-darwin
            runs-on: macos-14
          # Cross-compiled on the Apple-silicon pool and smoke-tested under
          # Rosetta 2.
          - platform: macos-x64
            target: x86_64-apple-darwin
            runs-on: macos-15
    env:
      # AppleDouble resource forks must not leak into the archive.
      COPYFILE_DISABLE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The tag matches the workspace version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match the workspace version ${version}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build (release, locked)
        run: cargo build --release --locked --target ${{ matrix.target }} -j 4 -p pa-cli --bin prime-env-harness
      - name: Package
        run: |
          python3 scripts/package_env_release.py \
            --binary "target/${{ matrix.target }}/release/prime-env-harness" \
            --platform "${{ matrix.platform }}" \
            --out-dir dist
      - name: Smoke-test the extracted payload
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scratch="$(mktemp -d)"
          tar -xzf "dist/prime-env-harness-${version}-${{ matrix.platform }}.tar.gz" -C "${scratch}"
          cd "${scratch}"
          "prime-env-harness-${version}-${{ matrix.platform }}/prime-env-harness" --version
      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The release notes are the tag's CHANGELOG.md section.
          awk -v heading="## ${version} " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no '## ${version} - <date>' section"
            exit 1
          fi
          (cd dist && cat ./*.sha256 > SHA256SUMS)
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Prime Env Harness ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${flags[@]}" \
            dist/*.tar.gz dist/SHA256SUMS
