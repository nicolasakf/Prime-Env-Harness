# Checks that ci.yml does not cover: the Docker-backed environment runtime
# (needs a Docker daemon, Node, and Python) and the dependency audit.
# fmt, clippy, and the test suite run in ci.yml.
name: Environment harness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: environments-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # pinned toolchain (see ci.yml)
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker info
      - run: cargo test -p pa-environments --features docker-integration -- --test-threads=1
        env:
          OPENAI_API_KEY: environment-test-sentinel
          ANTHROPIC_API_KEY: environment-test-sentinel
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --workspace
          command-arguments: advisories licenses
